syntax = "proto3";

package pb_message;


enum mission_t {
    invalid_mission = 0;
    no_mission = 1;
    explore = 2;
    attack = 3;
    evade = 4;
    intercept = 5;
    convoy_guard = 6;
    ground_attack = 7;
    privateer = 8;
    found_coloy = 9;
    expand_colony = 10;

    // Lifters only from here down.
    deliver_armies = 64;
    deliver_repair_yard = 65;
    deliver_mobile_base = 66;
    build_outpost = 67;
    build_starbase = 68;
    upgrade_base = 69;
}

message hex_coord_t
{
    int32 x = 1;
    int32 y = 2;
}
